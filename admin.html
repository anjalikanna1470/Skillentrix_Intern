<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="KANNA ANJALI - Admin Dashboard"
    >

    <title>
        Admin Dashboard | Anjali Kanna
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<header class="header">

    <nav class="navbar container">

        <a
            href="index.html"
            class="logo"
        >
            AK<span>.</span>
        </a>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    ← Back to Portfolio
                </a>
            </li>

            <li>

                <button
                    type="button"
                    class="theme-toggle"
                    id="themeToggle"
                    aria-label="Toggle theme"
                >
                    🌙
                </button>

            </li>

        </ul>

    </nav>

</header>


<main>

<section class="admin-section">

    <div class="container">


        <!-- =========================
             LOGIN
        ========================== -->

        <div
            id="adminLogin"
            class="admin-login"
        >

            <div class="section-heading">

                <p>
                    Restricted Area
                </p>

                <h2>
                    Admin Login
                </h2>

            </div>


            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="adminUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn primary-btn"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="form-message"
                    role="alert"
                ></p>

            </form>

        </div>


        <!-- =========================
             ADMIN DASHBOARD
        ========================== -->

        <div
            id="adminResponses"
            class="hidden"
        >

            <div class="admin-header">

                <div>

                    <p>
                        Admin Dashboard
                    </p>

                    <h2>
                        User Responses
                    </h2>

                </div>


                <div class="admin-actions">

                    <button
                        type="button"
                        id="refreshResponses"
                        class="btn secondary-btn"
                    >
                        Refresh
                    </button>

                    <button
                        type="button"
                        id="logoutButton"
                        class="btn secondary-btn"
                    >
                        Logout
                    </button>

                </div>

            </div>


            <div
                id="responsesContainer"
                class="responses-container"
            ></div>

        </div>

    </div>

</section>

</main>


<script src="admin.js"></script>

</body>

</html>
